<!DOCTYPE html>
<html>
<head>

    <title>Clinic Case Paper</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Clinic Case Paper</h1>

    <form action="/search" method="get">

        <label>Patient Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter patient name"
            required
        >

        <button type="submit">
            Search Patient
        </button>

    </form>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

</div>

</body>
</html>
